<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Card</title><style>
:root{color-scheme:light dark}body{font:14px system-ui,sans-serif;line-height:1.45;padding:14px;margin:0}button{font:inherit;padding:6px 10px;margin:3px;cursor:pointer;border:1px solid currentColor;border-radius:5px;background:transparent;color:inherit}button:focus-visible{outline:2px solid #438cf3}section{border-top:1px solid #8886;padding:8px 0}small{opacity:.75}.hidden{display:none}.bar{display:flex;flex-wrap:wrap}
</style></head><body><button id="restore" class="hidden">Task Card · Restore</button><main id="card"><div class="bar"><button id="minimize">Minimize</button><button id="generate">Generate card / Update</button><button id="refresh">Refresh</button></div><div id="content">Opening Task Card…</div></main><script>
let state=null,nextId=1,ready=false,preparing=false;const pending=new Map();const content=document.getElementById('content');
function request(method,params){const id=nextId++;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));}
function el(name,text){const node=document.createElement(name);node.textContent=text;return node;}
async function tool(name,args){if(!ready)throw Error('Task Card is still connecting to the host.');const result=await request('tools/call',{name,arguments:args});if(result?.isError)throw Error(result.content?.[0]?.text||'Task Card action failed');return result.structuredContent;}
async function open(args){state=await tool('task_card_open',{workspace:state.workspace,...args});render();}
function render(){content.replaceChildren();if(!state)return;const card=state.card;
if(!card){content.append(el('p','Select a captured conversation or saved card.'));for(const s of state.sessions||[]){const b=el('button',`${s.platform} · ${s.sessionId}`);b.onclick=()=>open({scope:{sessions:[{platform:s.platform,sessionId:s.sessionId}]}}).catch(showError);content.append(b);}for(const c of state.cards||[]){const b=el('button',`Open ${c.title}`);b.onclick=()=>open({cardId:c.id}).catch(showError);content.append(b);}return;}
content.append(el('h2',card.title||'Task Card'));content.append(el('small',`${card.status||'Not generated'} · revision ${card.revision}`));content.append(el('p',card.scope.sessions.map(s=>`${s.platform}: ${s.sessionId}`).join(', ')));
for(const claim of card.claims||[]){const section=el('section','');section.append(el('h3',claim.section),el('p',claim.text),el('small',`${claim.basis} · ${claim.evidenceIds.join(', ')}`));const b=el('button','Correct');b.onclick=async()=>{const text=prompt('Correct this claim',claim.text);if(text?.trim()){await tool('task_card_correct',{workspace:state.workspace,cardId:state.cardId,claimId:claim.id,text});await open({cardId:state.cardId});}};section.append(b);content.append(section);}
if(card.nextAction){const section=el('section','');section.append(el('h3','Next action'),el('p',card.nextAction.text));content.append(section);}
}
function showError(error){content.prepend(el('p',String(error)));}
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(m.error.message||String(m.error))):p.resolve(m.result);return;}if(m.method==='ui/notifications/tool-result'){state=m.params?.structuredContent||null;render();}});
document.getElementById('minimize').onclick=()=>{document.getElementById('card').classList.add('hidden');document.getElementById('restore').classList.remove('hidden');};
document.getElementById('restore').onclick=()=>{document.getElementById('card').classList.remove('hidden');document.getElementById('restore').classList.add('hidden');};
document.getElementById('refresh').onclick=()=>state?.cardId&&open({cardId:state.cardId}).catch(showError);
document.getElementById('generate').onclick=async()=>{if(!state?.cardId){showError('Select a conversation first.');return;}if(preparing)return;preparing=true;const button=document.getElementById('generate');button.disabled=true;try{const prepared=await tool('task_card_prepare',{workspace:state.workspace,cardId:state.cardId});await request('ui/message',{role:'user',content:[{type:'text',text:prepared.generationPrompt}]});content.prepend(el('p','Generation requested in this conversation. Refresh after the agent saves the card.'));}catch(error){showError(error);}finally{preparing=false;button.disabled=false;}};
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Code Buddy Task Card',version:'0.10.6'},appCapabilities:{}}).then(()=>{ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');}).catch(showError);
</script></body></html>
